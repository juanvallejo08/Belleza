<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Catálogo de belleza</title>
<style>
:root{--bg:#f7f3fd;--card:#fff;--tx:#2e2340;--mut:#6f6683;--pk:#6a2fb8;--soft:#efe6fb;--bd:#d9c9f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171122;--card:#241a33;--tx:#efe9fa;--mut:#b3a6cc;--pk:#8f6ae0;--soft:#33264a;--bd:#463460;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171122;--card:#241a33;--tx:#efe9fa;--mut:#b3a6cc;--pk:#8f6ae0;--soft:#33264a;--bd:#463460;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Arial,Helvetica,sans-serif}
header{position:relative;background:linear-gradient(135deg,#6a2fb8,#8b5cd8);color:#fff;padding:18px 14px 12px;text-align:center}header h1{margin:0;font-size:24px}header p{margin:2px 0 10px;opacity:.9}
input,select,button{font:inherit;color:var(--tx)}
.s{width:100%;max-width:420px;padding:10px 14px;border:0;border-radius:20px;background:#fff;color:#2e2340}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px}
.chip{flex:none;padding:7px 14px;border-radius:18px;border:1px solid var(--bd);background:var(--card);cursor:pointer}.chip.on{background:var(--pk);color:#fff;border-color:var(--pk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;padding:8px 12px 6px;max-width:1100px;margin:auto}
.sec{max-width:1100px;margin:14px auto 0;padding:0 14px;font-size:17px;color:var(--pk)}.sec small{color:var(--mut);font-size:12px;font-weight:400}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:6/7;object-fit:cover;display:block;background:var(--soft)}.b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.n{font-weight:700;font-size:13px}.pr{color:var(--pk);font-weight:700;font-size:17px}.ag{opacity:.55}
.btn{display:inline-block;background:var(--pk);color:#fff;border:0;border-radius:16px;padding:7px 12px;text-align:center;text-decoration:none;cursor:pointer;font-size:13px}.btn.g{background:var(--soft);color:var(--tx)}
.b input,.b select{width:100%;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:9}
.set{max-width:1100px;margin:8px auto;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.set label{font-size:12px;color:var(--mut)}.set input{width:100%;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.t{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:14px;z-index:20}
.em{text-align:center;color:var(--mut);padding:40px 12px}
.ci>div:first-child{flex:1;min-width:0}
.bm{position:relative;z-index:25}.hb{display:flex;flex-direction:column;justify-content:center;gap:4px;width:42px;height:34px;padding:0 11px;border:1px solid var(--bd);border-radius:18px;background:var(--card);cursor:pointer}.hb i{display:block;height:2px;border-radius:2px;background:var(--pk)}.hb.on{background:var(--pk);border-color:var(--pk)}.hb.on i{background:#fff}
.bp{position:absolute;left:0;top:42px;width:250px;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:left}.bp button{display:flex;justify-content:space-between;gap:8px;width:100%;padding:9px 14px;border:0;background:none;cursor:pointer;color:var(--tx);font-size:14px}.bp button.on{background:var(--soft);font-weight:700}.bp small{color:var(--mut)}
.cb{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:12;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:11px 16px;font-size:14px}.cb.o{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}.sp{background:var(--card);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ci{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.q{display:inline-flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--soft);cursor:pointer}.sp input,.sp textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-top:8px}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=s=>document.querySelector(s);
const CATS=['Labios','Rostro','Ojos y cejas','Cuidado facial','Corporal, fragancias y kits','Brochas y accesorios'];
const ST={nuevo:'Nuevo',preparando:'En preparación',listo:'Listo para envío o entrega',entregado:'Entregado'},NX={nuevo:['preparando','Empezar a preparar'],preparando:['listo','Marcar listo para envío'],listo:['entregado','Marcar entregado']};
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let D={store:'Catálogo de belleza',sub:'',phone:'',email:'',items:[]},cat='Todos',br='Todas',so='',q='',edit=false,owner=false,bo=false,md=null,co=false,po=false,lg=false,done=null,msg='',orders=[],del=[],nx=-1,cart=L('cart',{}),nt=L('nt',{}),cus=L('cus',{n:'',p:'',e:''});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>'$'+Math.round(v||0).toLocaleString('es-CO'),nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),out=i=>i.a||i.s===0;
const lines=()=>Object.keys(cart).map(id=>({it:D.items.find(i=>i.id==id),n:cart[id]})).filter(l=>l.it&&!out(l.it)&&l.n>0);
const total=()=>lines().reduce((s,l)=>s+l.it.p*l.n,0);
const wa=(t,p)=>{let d=(p||D.phone||'').replace(/\D/g,'');if(d.length==10)d='57'+d;return 'https://wa.me/'+d+(t?'?text='+encodeURIComponent(t):'')};
const stockLbl=it=>it.s>0?`<span class="n" style="color:var(--mut)">${it.s<=5?'¡Quedan solo '+it.s+'!':'Quedan '+it.s+' unidades'}</span>`:'';
const cartBtn=it=>{const n=cart[it.id]||0;return n?`<span class="q"><button data-dec="${it.id}">−</button><b>${n}</b><button data-inc="${it.id}">+</button></span>`:`<button class="btn" data-add="${it.id}">Agregar al carrito</button>`};
function card(it){
 if(!edit)return `<div class="card ${out(it)?'ag':''}"><img loading="lazy" src="${esc(it.i)}" alt="" data-md="${it.id}" style="cursor:zoom-in"><div class="b"><div class="n" data-md="${it.id}" style="cursor:pointer">${esc(it.n)}</div><div class="pr">${fmt(it.p)}</div>${out(it)?'<span class="n">Agotado</span>':stockLbl(it)+cartBtn(it)}</div></div>`;
 return `<div class="card" data-id="${it.id}"><img loading="lazy" src="${esc(it.i)}" alt=""><div class="b"><input data-f="n" value="${esc(it.n)}"><input data-f="b" list="bl" placeholder="Marca (vacío = Variedades)" value="${esc(it.b)}"><input data-f="p" type="number" inputmode="numeric" min="0" step="500" value="${it.p}"><input data-f="s" type="number" inputmode="numeric" min="0" placeholder="Unidades (vacío = sin control)" value="${it.s??''}"><select data-f="c">${CATS.map(c=>`<option ${c==it.c?'selected':''}>${esc(c)}</option>`).join('')}</select><label><input data-f="a" type="checkbox" style="width:auto" ${it.a?'checked':''}> Marcar agotado</label><button class="btn g" data-img="${it.id}">Cambiar foto</button> <button class="btn g" data-del="${it.id}">Quitar</button></div></div>`}
function modalUI(){const it=D.items.find(i=>i.id==md);if(!it||edit)return'';
 return `<div class="sh" data-mc="1"><div class="sp" style="padding:0"><img src="${esc(it.i)}" alt="" style="width:100%;display:block;max-height:60vh;object-fit:contain;background:var(--soft)"><div style="padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))"><div class="n" style="font-size:17px">${esc(it.n)}</div>${it.b?`<div style="color:var(--mut)">${esc(it.b)}</div>`:''}<div class="pr" style="font-size:22px;margin:6px 0">${fmt(it.p)}</div>${out(it)?'<span class="n">Agotado</span>':stockLbl(it)+`<div style="margin-top:8px">${cartBtn(it)}</div>`}<button class="btn g" style="margin-top:12px" data-mc="1">Cerrar</button></div></div></div>`}
function cartUI(){if(edit)return'';const Ls=lines(),c=Ls.reduce((s,l)=>s+l.n,0);let h='';
 if(c)h+=`<button class="btn cb ${owner?'o':''}" data-open="1">🛒 Carrito (${c}) · ${fmt(total())}</button>`;
 if(done)h+=`<div class="sh" data-dn="1"><div class="sp"><b style="font-size:18px">¡Pedido recibido!</b><p>Tu pedido <b>#${done}</b> quedó registrado. Te contactaremos pronto para confirmar el pago y la entrega.</p>${D.phone?`<a class="btn" target="_blank" rel="noopener" href="${wa('Hola, hice el pedido #'+done)}">Avisar por WhatsApp</a> `:''}<button class="btn g" data-dn="1">Cerrar</button></div></div>`;
 if(co&&c)h+=`<div class="sh" data-close="1"><div class="sp"><b style="font-size:18px">Tu pedido</b>${Ls.map(l=>`<div class="ci"><div><div class="n">${esc(l.it.n)}</div><span>${fmt(l.it.p)} c/u</span><input data-nt="${l.it.id}" placeholder="Tono, color o nota (opcional)" value="${esc(nt[l.it.id]||'')}"></div><div style="text-align:right"><span class="q"><button data-dec="${l.it.id}">−</button><b>${l.n}</b><button data-inc="${l.it.id}">+</button></span><div class="pr" style="font-size:14px">${fmt(l.it.p*l.n)}</div></div></div>`).join('')}<p class="pr">Total: ${fmt(total())}</p><input id="cn" placeholder="Nombre completo *" value="${esc(cus.n)}"><input id="cp" type="tel" inputmode="tel" placeholder="Teléfono / WhatsApp *" value="${esc(cus.p)}"><input id="ce" type="email" placeholder="Correo electrónico *" value="${esc(cus.e)}"><button class="btn" style="display:block;width:100%;margin-top:10px" data-send="1">Hacer pedido</button><button class="btn g" style="margin-top:8px" data-clear="1">Vaciar carrito</button> <button class="btn g" data-close="1">Seguir comprando</button></div></div>`;
 return h}
function ordersUI(){if(!owner||edit||!po)return'';return `<div class="sh" data-pc="1"><div class="sp"><b style="font-size:18px">Pedidos</b>${orders.map(o=>`<div class="ci" style="display:block${o.status=='entregado'?';opacity:.55':''}"><div class="n">#${o.id} · ${new Date(o.created_at).toLocaleString('es-CO')}</div><div>${esc(o.name)} · <a target="_blank" rel="noopener" href="${wa('',o.phone)}">${esc(o.phone)}</a> · ${esc(o.email)}</div><div class="pr" style="font-size:13px">${ST[o.status]||esc(o.status)}</div>${o.items.map(l=>`<div>${l.qty} x ${esc(l.name)}${l.note?' ('+esc(l.note)+')':''}</div>`).join('')}<div class="pr" style="font-size:14px">${fmt(o.total)}</div>${NX[o.status]?`<button class="btn" data-adv="${o.id}">${NX[o.status][1]}</button> `:''}<button class="btn g" data-odel="${o.id}">Borrar</button></div>`).join('')||'<p class="em">Aún no hay pedidos.</p>'}<button class="btn g" style="margin-top:8px" data-pc="1">Cerrar</button></div></div>`}
function loginUI(){return lg?`<div class="sh" data-lc="1"><div class="sp"><b style="font-size:18px">Administrador</b><input id="le" type="email" placeholder="Correo"><input id="lp" type="password" placeholder="Contraseña"><button class="btn" style="margin-top:10px" data-li="1">Entrar</button> <button class="btn g" data-lc="1">Cancelar</button></div></div>`:''}
function render(){
 const bc={};D.items.forEach(i=>i.b&&(bc[i.b]=(bc[i.b]||0)+1));const bg=i=>i.b?(bc[i.b]>1?i.b:'Otras marcas'):'Variedades',rk=x=>x=='Variedades'?2:x=='Otras marcas'?1:0,bl=[...new Set(D.items.map(bg))].sort((a,b)=>rk(a)-rk(b)||a.localeCompare(b,'es'));if(br!='Todas'&&!bl.includes(br))br='Todas';
 const f=D.items.filter(i=>(cat=='Todos'||i.c==cat)&&(br=='Todas'||bg(i)==br)&&nz(i.n).includes(nz(q)));if(so)f.sort((a,b)=>so=='asc'?a.p-b.p:b.p-a.p);
 const nn=orders.filter(o=>o.status=='nuevo').length;
 $('#app').innerHTML=`<header><h1>${esc(D.store)}</h1><p>${esc(D.sub)}</p><input class="s" id="q" placeholder="Buscar producto…" value="${esc(q)}"></header>
 <div class="chips"><div class="bm"><button class="hb ${br!='Todas'?'on':''}" data-bo="1" aria-label="Marcas"><i></i><i></i><i></i></button>${bo?`<div class="bp">${['Todas',...bl].map(g=>`<button class="${g==br?'on':''}" data-br="${esc(g)}"><span>${g=='Todas'?'Todas las marcas':esc(g)}</span><small>${g=='Todas'?D.items.length:D.items.filter(i=>bg(i)==g).length}</small></button>`).join('')}</div>`:''}</div>${br!='Todas'?`<span class="chip on" data-br="Todas">${esc(br)} ✕</span>`:''}${['Todos',...CATS].map(c=>`<span class="chip ${c==cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</span>`).join('')}<span class="chip ${so?'on':''}" data-so="1">Precio ${so=='asc'?'↑ menor a mayor':so=='desc'?'↓ mayor a menor':'⇅'}</span></div>
 ${edit?`<div class="set"><div><label>Nombre de la tienda</label><input data-s="store" value="${esc(D.store)}"></div><div><label>Subtítulo</label><input data-s="sub" value="${esc(D.sub)}"></div><div><label>WhatsApp (10 dígitos)</label><input data-s="phone" inputmode="tel" value="${esc(D.phone)}"></div><div><label>Correo de la tienda</label><input data-s="email" type="email" value="${esc(D.email)}"></div><div><label>Subir o bajar todos los precios (%)</label><input id="pct" type="number" placeholder="Ej: 10 o -5"><button class="btn" id="ap" style="margin-top:6px">Aplicar</button></div></div>`:''}
 <div class="grid">${f.map(card).join('')||'<div class="em">No hay productos con ese filtro.</div>'}</div>${owner?'':'<div class="em" style="padding:10px"><a href="#" data-lg="1" style="color:var(--mut);font-size:12px">Administrador</a></div>'}<div style="height:90px"></div>${edit?`<datalist id="bl">${[...new Set(D.items.map(i=>i.b).filter(Boolean))].sort().map(b=>`<option value="${esc(b)}">`).join('')}</datalist>`:''}
 ${owner?`<div class="bar">${edit?'<button class="btn g" id="add">+ Agregar producto</button><button class="btn" id="sv">Guardar cambios</button><button class="btn g" id="ex">Salir sin guardar</button>':`<button class="btn g" data-po="1">Pedidos${nn?' ('+nn+')':''}</button><button class="btn" id="ed">Editar catálogo</button><button class="btn g" id="lo">Cerrar sesión</button>`}</div>`:''}${modalUI()}${cartUI()}${ordersUI()}${loginUI()}${msg?`<div class="t">${esc(msg)}</div>`:''}`;
 const s=$('#q');if(s&&document.activeElement===document.body&&q){s.focus();s.setSelectionRange(q.length,q.length)}}
function toast(m){msg=m;render();setTimeout(()=>{msg='';render()},2600)}
async function load(){const[a,b]=await Promise.all([sb.from('products').select('*').order('id'),sb.from('settings').select('*').single()]);
 if(a.error||b.error){$('#app').innerHTML='<p style="padding:24px">No se pudo cargar el catálogo. Revisa config.js y que el SQL se haya ejecutado.</p>';return false}
 D.items=a.data.map(r=>({id:r.id,n:r.name,b:r.brand||'',c:r.category,p:r.price,s:r.stock,a:r.sold_out?1:0,i:r.image}));D.store=b.data.store;D.sub=b.data.sub||'';D.phone=b.data.whatsapp||'';D.email=b.data.email||'';document.title=D.store;render();return true}
async function loadOrders(){const r=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);if(!r.error)orders=r.data}
async function saveAll(){toast('Guardando…');try{
 for(const it of D.items){if(!it._d)continue;
  if((it.i||'').startsWith('data:')){const bl=await(await fetch(it.i)).blob(),p='p'+Date.now()+Math.random().toString(36).slice(2,6)+'.jpg',u=await sb.storage.from('fotos').upload(p,bl,{contentType:'image/jpeg'});if(u.error)throw u.error;it.i=sb.storage.from('fotos').getPublicUrl(p).data.publicUrl}
  const row={name:it.n,brand:it.b||null,category:it.c,price:it.p||0,stock:it.s??null,sold_out:!!it.a,image:it.i},r=it.id<0?await sb.from('products').insert(row).select().single():await sb.from('products').update(row).eq('id',it.id);if(r.error)throw r.error;if(it.id<0)it.id=r.data.id;delete it._d}
 for(const id of del){const r=await sb.from('products').delete().eq('id',id);if(r.error)throw r.error}del=[];
 const s=await sb.from('settings').update({store:D.store,sub:D.sub,whatsapp:D.phone,email:D.email}).eq('id',1);if(s.error)throw s.error;
 edit=false;await load();toast('Cambios guardados')}catch(e){toast('No se pudo guardar: '+(e.message||e))}}
function pickImg(cb){const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.onchange=()=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=480;c.height=560;const x=c.getContext('2d'),k=Math.max(480/im.width,560/im.height);x.drawImage(im,(480-im.width*k)/2,(560-im.height*k)/2,im.width*k,im.height*k);cb(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(fi.files[0])};fi.click()}
async function send(){const n=cus.n.trim(),p=cus.p.trim(),e=cus.e.trim();
 if(n.length<2||!/^[0-9+ ()-]{7,20}$/.test(p)||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('Completa nombre, teléfono y correo válidos');return}
 const r=await sb.rpc('place_order',{p_name:n,p_phone:p,p_email:e,p_items:lines().map(l=>({id:l.it.id,qty:l.n,note:nt[l.it.id]||''}))});
 if(r.error){toast(/disponible/.test(r.error.message)?'Un producto ya no está disponible. Revisa tu carrito.':'No se pudo enviar el pedido');await load();return}
 cart={};W('cart',cart);co=false;done=r.data;render()}
document.addEventListener('click',async e=>{const t=e.target,c=s=>t.closest(s);
 if(bo&&!c('.bm')){bo=false;render()}
 if(t.dataset.cat){cat=t.dataset.cat;render()}
 else if(t.dataset.so){so=so==''?'asc':so=='asc'?'desc':'';render()}
 else if(t.dataset.mc){md=null;render()}
 else if(c('[data-md]')){md=c('[data-md]').dataset.md;render()}
 else if(c('[data-br]')){br=c('[data-br]').dataset.br;bo=false;render()}
 else if(c('[data-bo]')){bo=!bo;render()}
 else if(t.dataset.lg){e.preventDefault();lg=true;render()}
 else if(t.dataset.lc){lg=false;render()}
 else if(t.dataset.li){const r=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(r.error){toast('Correo o contraseña incorrectos');return}owner=true;lg=false;await loadOrders();render()}
 else if(t.id=='lo'){await sb.auth.signOut();owner=false;edit=false;orders=[];render()}
 else if(t.id=='ed'){edit=true;render()}
 else if(t.id=='ex'){del=[];edit=false;await load()}
 else if(t.id=='sv')saveAll();
 else if(t.dataset.del){if(confirm('¿Quitar este producto?')){const id=+t.dataset.del;if(id>0)del.push(id);D.items=D.items.filter(i=>i.id!=id);render()}}
 else if(t.dataset.img){const it=D.items.find(i=>i.id==t.dataset.img);pickImg(u=>{it.i=u;it._d=1;render()})}
 else if(t.id=='ap'){const v=parseFloat($('#pct').value);if(!isNaN(v)){D.items.forEach(i=>{i.p=Math.round(i.p*(1+v/100)/100)*100;i._d=1});toast('Precios ajustados '+v+'% (falta guardar)')}}
 else if(t.id=='add'){pickImg(u=>{D.items.unshift({id:nx--,n:'Producto nuevo',p:0,c:CATS[0],b:'',s:null,a:0,i:u,_d:1});render();scrollTo(0,0)})}
 else if(t.dataset.add||t.dataset.inc){const id=t.dataset.add||t.dataset.inc,it=D.items.find(i=>i.id==id);if(it&&it.s!=null&&(cart[id]||0)>=it.s){toast('Solo quedan '+it.s+' unidades');return}cart[id]=(cart[id]||0)+1;W('cart',cart);render()}
 else if(t.dataset.dec){const id=t.dataset.dec;cart[id]=Math.max(0,(cart[id]||0)-1);if(!cart[id])delete cart[id];W('cart',cart);if(!lines().length)co=false;render()}
 else if(t.dataset.open){co=true;render()}
 else if(t.dataset.close){co=false;render()}
 else if(t.dataset.clear){cart={};W('cart',cart);co=false;render()}
 else if(t.dataset.send)send();
 else if(t.dataset.dn){done=null;render()}
 else if(t.dataset.po){await loadOrders();po=true;render()}
 else if(t.dataset.pc){po=false;render()}
 else if(t.dataset.adv){const o=orders.find(x=>x.id==t.dataset.adv);if(!o||!NX[o.status])return;const r=await sb.from('orders').update({status:NX[o.status][0]}).eq('id',o.id);if(r.error){toast('No se pudo actualizar');return}await loadOrders();await load()}
 else if(t.dataset.odel){if(confirm('¿Borrar este pedido?')){await sb.from('orders').delete().eq('id',t.dataset.odel);await loadOrders();render()}}});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='q'){q=t.value;render();return}
 if(t.id=='cn'){cus.n=t.value;W('cus',cus);return}if(t.id=='cp'){cus.p=t.value;W('cus',cus);return}if(t.id=='ce'){cus.e=t.value;W('cus',cus);return}
 if(t.dataset.nt){nt[t.dataset.nt]=t.value;W('nt',nt);return}if(t.dataset.s){D[t.dataset.s]=t.value;return}
 const c=t.closest('[data-id]');if(!c||!t.dataset.f)return;const it=D.items.find(i=>i.id==c.dataset.id),f=t.dataset.f;
 it[f]=f=='p'?Number(t.value):f=='a'?(t.checked?1:0):f=='s'?(t.value===''?null:Math.max(0,parseInt(t.value)||0)):t.value;it._d=1});
(async()=>{const s=await sb.auth.getSession();owner=!!s.data.session;if(await load()&&owner){await loadOrders();render()}})();
</script></body></html>
